<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주말 특근 신청</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#f5f4f0;min-height:100vh;color:#1a1a1a}
.wrap{max-width:560px;margin:0 auto;padding:2rem 1rem 4rem}
.header{text-align:center;margin-bottom:2rem}
.header h1{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}
.header p{font-size:13px;color:#888}
.tab-bar{display:flex;background:#fff;border-radius:12px;padding:4px;margin-bottom:1.5rem;border:1px solid #e8e6e0}
.tab{flex:1;padding:9px;font-size:13px;font-weight:500;border:none;background:none;border-radius:9px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;color:#888;transition:all .2s}
.tab.active{background:#1a1a1a;color:#fff}
.view{display:none}.view.active{display:block}
.card{background:#fff;border-radius:14px;border:1px solid #e8e6e0;padding:1.25rem;margin-bottom:1rem}
.card-title{font-size:11px;font-weight:600;color:#aaa;letter-spacing:.08em;text-transform:uppercase;margin-bottom:1rem}
.field label{display:block;font-size:12px;font-weight:500;color:#666;margin-bottom:8px}
.field input{width:100%;padding:9px 11px;font-size:14px;border:1px solid #e0ddd8;border-radius:9px;background:#fafaf8;color:#1a1a1a;font-family:'Noto Sans KR',sans-serif;outline:none;transition:border .15s}
.field input:focus{border-color:#1a1a1a;background:#fff}

/* 달력 */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-header span{font-size:14px;font-weight:600}
.cal-nav{background:none;border:1px solid #e0ddd8;border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:#555}
.cal-nav:hover{background:#f5f4f0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{text-align:center;font-size:11px;font-weight:600;color:#aaa;padding:4px 0}
.cal-dow.sun{color:#ef4444}.cal-dow.sat{color:#3b82f6}
.cal-day{text-align:center;padding:7px 2px;font-size:13px;border-radius:8px;cursor:pointer;border:1.5px solid transparent;transition:all .15s;position:relative}
.cal-day:hover:not(.empty):not(.past){background:#f5f4f0}
.cal-day.empty{cursor:default}
.cal-day.past{color:#ccc;cursor:not-allowed}
.cal-day.sun:not(.past){color:#ef4444}
.cal-day.sat:not(.past){color:#3b82f6}
.cal-day.selected{background:#1a1a1a!important;color:#fff!important;border-color:#1a1a1a}
.cal-day.today{border-color:#1a1a1a}
.cal-day.today.selected{background:#1a1a1a;color:#fff}
.selected-tags{display:flex;flex-wrap:wrap;gap:6px;min-height:28px;margin-top:10px}
.tag{background:#1a1a1a;color:#fff;font-size:12px;padding:3px 10px;border-radius:100px;display:flex;align-items:center;gap:5px}
.tag button{background:none;border:none;color:#aaa;cursor:pointer;font-size:13px;padding:0;line-height:1}
.tag button:hover{color:#fff}
.hint-txt{font-size:11px;color:#bbb;margin-top:8px}

.btn-submit{width:100%;padding:12px;background:#1a1a1a;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin-top:.25rem;transition:opacity .15s}
.btn-submit:hover{opacity:.85}
.btn-submit:disabled{opacity:.4;cursor:not-allowed}
.success{background:#f0faf4;border:1px solid #b6e8c8;border-radius:10px;padding:1rem;font-size:13px;color:#1a7f4b;text-align:center;margin-top:.75rem;display:none}

/* 현황 탭 */
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.week-label{font-size:14px;font-weight:600}
.week-btn{background:#fff;border:1px solid #e0ddd8;border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;color:#555}
.week-btn:hover{border-color:#1a1a1a;color:#1a1a1a}
.week-btn:disabled{opacity:.3;cursor:default}
.day-block{background:#fff;border-radius:12px;border:1px solid #e8e6e0;margin-bottom:10px;overflow:hidden}
.day-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #f0ede8}
.day-title{font-size:13px;font-weight:600}
.day-title.sun{color:#ef4444}.day-title.sat{color:#3b82f6}
.day-count{font-size:11px;color:#aaa;background:#f5f4f0;padding:2px 8px;border-radius:100px}
.person-row{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid #f5f3ef;font-size:13px}
.person-row:last-child{border-bottom:none}
.person-name{font-weight:500}
.badge{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:6px}
.badge.pending{background:#fef3c7;color:#92400e}
.badge.approved{background:#d1fae5;color:#065f46}
.badge.rejected{background:#fee2e2;color:#991b1b}
.action-btns{display:flex;gap:4px}
.abtn{padding:3px 8px;font-size:11px;font-weight:500;border-radius:6px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;border:1px solid;transition:opacity .15s}
.abtn:hover{opacity:.7}
.abtn-ok{background:#d1fae5;color:#065f46;border-color:#6ee7b7}
.abtn-no{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
.abtn-del{background:#f5f3ef;color:#aaa;border-color:#e0ddd8}
.no-data{text-align:center;padding:1.5rem;font-size:13px;color:#bbb}
.day-empty{padding:10px 14px;font-size:12px;color:#ccc}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
.stat{background:#fff;border:1px solid #e8e6e0;border-radius:12px;padding:.75rem 1rem}
.stat .s-label{font-size:11px;color:#aaa;margin-bottom:2px}
.stat .s-val{font-size:20px;font-weight:600}
.s-val.warn{color:#d97706}.s-val.ok{color:#059669}.s-val.bad{color:#dc2626}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:99;padding:1rem}
.confirm-box{background:#fff;border-radius:14px;padding:1.5rem;width:100%;max-width:300px;text-align:center}
.confirm-box p{font-size:14px;line-height:1.7;margin-bottom:1.25rem}
.confirm-btns{display:flex;gap:8px;justify-content:center}
.confirm-btns button{padding:8px 22px;font-size:13px;font-weight:500;border-radius:9px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;border:1px solid}
.cbtn-cancel{background:#f5f3ef;color:#555;border-color:#e0ddd8}
.cbtn-del{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;transition:transform .3s,opacity .3s;z-index:999;opacity:0;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.loading-row{text-align:center;padding:2rem;font-size:13px;color:#aaa}
.refresh-btn{font-size:12px;color:#aaa;background:none;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>주말 특근 신청</h1>
    <p>신청 후 관리자 승인을 기다려 주세요</p>
  </div>
  <div class="tab-bar">
    <button class="tab active" onclick="switchTab('apply',this)">특근 신청</button>
    <button class="tab" onclick="switchTab('status',this)">신청 현황</button>
  </div>

  <!-- 신청 탭 -->
  <div id="view-apply" class="view active">
    <div class="card">
      <div class="card-title">이름</div>
      <div class="field">
        <input type="text" id="f-name" placeholder="홍길동">
      </div>
    </div>
    <div class="card">
      <div class="card-title">특근 날짜 선택 <span style="font-weight:400;color:#bbb">(복수 선택 가능)</span></div>
      <div class="cal-header">
        <button class="cal-nav" onclick="prevMonth()">‹</button>
        <span id="cal-title"></span>
        <button class="cal-nav" onclick="nextMonth()">›</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="selected-tags" id="selected-tags"></div>
      <p class="hint-txt" id="sel-hint">날짜를 선택하세요</p>
    </div>
    <button class="btn-submit" id="submit-btn" onclick="submitApply()">신청 제출</button>
    <div class="success" id="success-msg">✓ 신청이 완료되었습니다. 승인 결과를 기다려 주세요.</div>
  </div>

  <!-- 현황 탭 -->
  <div id="view-status" class="view">
    <div class="stat-row" id="stat-row"></div>
    <div class="week-nav">
      <button class="week-btn" id="btn-prev-week" onclick="changeWeek(-1)">← 이전 주</button>
      <span class="week-label" id="week-label"></span>
      <button class="week-btn" onclick="changeWeek(1)">다음 주 →</button>
    </div>
    <div id="week-view"><div class="loading-row">불러오는 중...</div></div>
    <div style="text-align:center;margin-top:.5rem">
      <button class="refresh-btn" onclick="loadData()">↻ 새로고침</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzV96fRGYt-ANqrLd9I1YQIWkoScII_YAGe9SJOEj-146hTRTDQFbdaYH2EJYFecGO0ug/exec';
var applications = [];
var selectedDates = [];
var calYear, calMonth;
var weekOffset = 0;
var pendingDeleteId = null;
var statusTabLoaded = false;

var DAYS = ['일','월','화','수','목','금','토'];

// ── 탭 ──
function switchTab(t, el) {
  document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active')});
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active')});
  el.classList.add('active');
  document.getElementById('view-'+t).classList.add('active');
  if (t === 'status' && !statusTabLoaded) { statusTabLoaded=true; loadData(); }
}

// ── 달력 ──
function initCal() {
  var today = new Date();
  calYear = today.getFullYear();
  calMonth = today.getMonth();
  renderCal();
}
function prevMonth() { calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCal(); }
function nextMonth() { calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCal(); }

function renderCal() {
  document.getElementById('cal-title').textContent = calYear+'년 '+(calMonth+1)+'월';
  var grid = document.getElementById('cal-grid');
  var dows = ['일','월','화','수','목','금','토'];
  var html = dows.map(function(d,i){
    return '<div class="cal-dow'+(i===0?' sun':i===6?' sat':'')+'">'+ d +'</div>';
  }).join('');
  var first = new Date(calYear, calMonth, 1).getDay();
  var days = new Date(calYear, calMonth+1, 0).getDate();
  var today = new Date(); today.setHours(0,0,0,0);
  for(var i=0;i<first;i++) html += '<div class="cal-day empty"></div>';
  for(var d=1;d<=days;d++){
    var thisDate = new Date(calYear, calMonth, d);
    var dow = thisDate.getDay();
    var isPast = thisDate < today;
    var dateStr = fmtDateStr(calYear, calMonth+1, d);
    var cls = 'cal-day';
    if(dow===0) cls+=' sun';
    if(dow===6) cls+=' sat';
    if(isPast) cls+=' past';
    if(thisDate.toDateString()===today.toDateString()) cls+=' today';
    if(selectedDates.indexOf(dateStr)>-1) cls+=' selected';
    if(isPast){
      html += '<div class="'+cls+'">'+d+'</div>';
    } else {
      html += '<div class="'+cls+'" onclick="toggleDate(\''+dateStr+'\',this)">'+d+'</div>';
    }
  }
  grid.innerHTML = html;
  renderTags();
}

function fmtDateStr(y,m,d){
  return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}

function toggleDate(dateStr, el) {
  var idx = selectedDates.indexOf(dateStr);
  if(idx>-1){ selectedDates.splice(idx,1); el.classList.remove('selected'); }
  else { selectedDates.push(dateStr); el.classList.add('selected'); }
  selectedDates.sort();
  renderTags();
}

function removeDate(dateStr) {
  selectedDates = selectedDates.filter(function(d){return d!==dateStr;});
  renderCal();
}

function renderTags() {
  var hint = document.getElementById('sel-hint');
  var container = document.getElementById('selected-tags');
  if(selectedDates.length===0){
    container.innerHTML='';
    hint.textContent='날짜를 선택하세요';
    return;
  }
  hint.textContent = selectedDates.length+'개 날짜 선택됨';
  container.innerHTML = selectedDates.map(function(ds){
    var parts = ds.split('-');
    var dow = DAYS[new Date(ds).getDay()];
    var label = parts[1]+'/'+ parts[2] +' ('+dow+')';
    return '<div class="tag">'+label+'<button onclick="removeDate(\''+ds+'\')">×</button></div>';
  }).join('');
}

// ── 신청 제출 ──
function submitApply() {
  var name = document.getElementById('f-name').value.trim();
  if(!name){ showToast('이름을 입력해 주세요.'); return; }
  if(selectedDates.length===0){ showToast('날짜를 선택해 주세요.'); return; }

  var btn = document.getElementById('submit-btn');
  btn.disabled=true; btn.textContent='제출 중...';

  var params = new URLSearchParams();
  params.append('action','add');
  params.append('name', name);
  params.append('dates', selectedDates.join(','));

  fetch(SCRIPT_URL, {method:'POST', body:params})
    .then(function(r){return r.json();})
    .then(function(d){
      btn.disabled=false; btn.textContent='신청 제출';
      if(d.result==='success'){
        document.getElementById('f-name').value='';
        selectedDates=[];
        renderCal();
        var s=document.getElementById('success-msg');
        s.style.display='block';
        setTimeout(function(){s.style.display='none';},4000);
        statusTabLoaded=false;
      } else { showToast('오류가 발생했습니다.'); }
    })
    .catch(function(){ btn.disabled=false; btn.textContent='신청 제출'; showToast('네트워크 오류가 발생했습니다.'); });
}

// ── 현황 ──
function loadData() {
  document.getElementById('week-view').innerHTML='<div class="loading-row">불러오는 중...</div>';
  var cbName='cb_'+Date.now();
  window[cbName]=function(d){
    applications=d.data||[];
    renderStats();
    renderWeek();
    delete window[cbName];
    var s=document.getElementById('jsonp-script');
    if(s)s.remove();
  };
  var script=document.createElement('script');
  script.id='jsonp-script';
  script.src=SCRIPT_URL+'?action=get&callback='+cbName;
  script.onerror=function(){ document.getElementById('week-view').innerHTML='<div class="loading-row">데이터를 불러오지 못했습니다.</div>'; };
  document.head.appendChild(script);
}

function getWeekRange(offset) {
  var today = new Date(); today.setHours(0,0,0,0);
  var dow = today.getDay();
  var sun = new Date(today); sun.setDate(today.getDate()-dow + offset*7);
  var sat = new Date(sun); sat.setDate(sun.getDate()+6);
  return {sun:sun, sat:sat};
}

function changeWeek(dir) {
  weekOffset += dir;
  renderWeek();
}

function renderStats() {
  var today = new Date(); today.setHours(0,0,0,0);
  var todayStr = fmtDateStr(today.getFullYear(), today.getMonth()+1, today.getDate());
  var future = applications.filter(function(a){ return a.date >= todayStr; });
  var pending = future.filter(function(a){return a.status==='대기 중';}).length;
  var approved = future.filter(function(a){return a.status==='승인';}).length;
  var rejected = future.filter(function(a){return a.status==='반려';}).length;
  document.getElementById('stat-row').innerHTML =
    '<div class="stat"><div class="s-label">승인 대기</div><div class="s-val warn">'+pending+'</div></div>'+
    '<div class="stat"><div class="s-label">승인 완료</div><div class="s-val ok">'+approved+'</div></div>'+
    '<div class="stat"><div class="s-label">반려</div><div class="s-val bad">'+rejected+'</div></div>';
}

function renderWeek() {
  var range = getWeekRange(weekOffset);
  var sun = range.sun; var sat = range.sat;
  var fmt = function(d){ return (d.getMonth()+1)+'/'+d.getDate(); };
  document.getElementById('week-label').textContent = fmt(sun)+' – '+fmt(sat);
  document.getElementById('btn-prev-week').disabled = weekOffset <= 0;

  var html = '';
  for(var i=0;i<7;i++){
    var day = new Date(sun); day.setDate(sun.getDate()+i);
    var dateStr = fmtDateStr(day.getFullYear(), day.getMonth()+1, day.getDate());
    var dow = day.getDay();
    var dowLabel = ['일','월','화','수','목','금','토'][dow];
    var dowClass = dow===0?'sun':dow===6?'sat':'';
    var dayApps = applications.filter(function(a){ return a.date===dateStr; });

    html += '<div class="day-block">';
    html += '<div class="day-header">';
    html += '<span class="day-title '+dowClass+'">'+(day.getMonth()+1)+'월 '+day.getDate()+'일 ('+dowLabel+')</span>';
    html += '<span class="day-count">'+dayApps.length+'명</span>';
    html += '</div>';

    if(dayApps.length===0){
      html += '<div class="day-empty">신청 없음</div>';
    } else {
      dayApps.forEach(function(a){
        var statusClass = a.status==='대기 중'?'pending':a.status==='승인'?'approved':'rejected';
        var actionArea;
        if(a.status==='대기 중'){
          actionArea='<div class="action-btns">'+
            '<button class="abtn abtn-ok" onclick="setStatus('+a.row+',\'승인\')">승인</button>'+
            '<button class="abtn abtn-no" onclick="setStatus('+a.row+',\'반려\')">반려</button>'+
            '<button class="abtn abtn-del" onclick="confirmDelete('+a.row+',\''+a.name+'\')">삭제</button>'+
            '</div>';
        } else {
          actionArea='<div class="action-btns">'+
            '<span class="badge '+statusClass+'">'+a.status+'</span>'+
            '<button class="abtn abtn-del" onclick="confirmDelete('+a.row+',\''+a.name+'\')">삭제</button>'+
            '</div>';
        }
        html += '<div class="person-row"><span class="person-name">'+a.name+'</span>'+actionArea+'</div>';
      });
    }
    html += '</div>';
  }
  document.getElementById('week-view').innerHTML = html;
}

function setStatus(row, status) {
  var params = new URLSearchParams();
  params.append('action','update');
  params.append('row', row);
  params.append('status', status);
  fetch(SCRIPT_URL, {method:'POST', body:params})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.result==='success'){ loadData(); showToast(status==='승인'?'승인 처리되었습니다.':'반려 처리되었습니다.'); }
    })
    .catch(function(){ showToast('처리 중 오류가 발생했습니다.'); });
}

function confirmDelete(row, name) {
  pendingDeleteId = row;
  var overlay = document.createElement('div');
  overlay.className='overlay'; overlay.id='confirm-overlay';
  overlay.innerHTML='<div class="confirm-box"><p><strong>'+name+'</strong> 님의 신청 내역을<br>삭제할까요?</p>'+
    '<div class="confirm-btns">'+
    '<button class="cbtn-cancel" onclick="closeConfirm()">취소</button>'+
    '<button class="cbtn-del" onclick="doDelete()">삭제</button>'+
    '</div></div>';
  document.body.appendChild(overlay);
}
function closeConfirm(){ var o=document.getElementById('confirm-overlay'); if(o)o.remove(); pendingDeleteId=null; }
function doDelete(){
  var params=new URLSearchParams();
  params.append('action','delete');
  params.append('row', pendingDeleteId);
  closeConfirm();
  fetch(SCRIPT_URL,{method:'POST',body:params})
    .then(function(r){return r.json();})
    .then(function(d){ if(d.result==='success'){ loadData(); showToast('삭제되었습니다.'); } })
    .catch(function(){ showToast('삭제 중 오류가 발생했습니다.'); });
}

function showToast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},2500); }

initCal();
</script>
</body>
</html>
